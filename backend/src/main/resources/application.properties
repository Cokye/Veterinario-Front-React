# Puerto donde escucha el backend. El frontend apuntara aqui.
server.port=8080

# Nombre de la aplicacion (aparece en los logs).
spring.application.name=demo-usuarios

# Mostrar mensajes de error claros en las respuestas (util en desarrollo).
server.error.include-message=always

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=oracle
spring.datasource.password=oracle
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# --- JWT ---
# Clave secreta para firmar los tokens (HS256 necesita al menos 32 bytes).
# IMPORTANTE: en un proyecto real esto NO va en el codigo/properties versionado,
# sino en una variable de entorno o un gestor de secretos.
jwt.secret=clave-secreta-asdljnsadkusabnxzczasdsalkcxnmzcuaermasdahedsaras
# Duracion del token: 1 hora, en milisegundos.
jwt.expiration-ms=3600000

# --- Cifrado de la comunicacion (RSA-OAEP + AES-256-GCM) ---
# Si es true, el backend RECHAZA cualquier peticion a /api/** que no venga
# cifrada (unica excepcion: GET /api/crypto/public-key).
# Ponlo en false solo si necesitas probar con Postman/curl en texto plano.
app.cifrado.obligatorio=true

# Par de claves RSA del servidor, en base64 (publica en formato X.509/SPKI,
# privada en PKCS#8). Si se dejan vacias, se genera un par NUEVO en cada
# arranque: comodo en desarrollo, pero el frontend debe volver a pedir la clave
# publica tras cada reinicio (ya lo hace solo).
app.cifrado.clave-
app.cifrado.clave-

# Origenes autorizados (CORS). Los usan SecurityConfig y CifradoFiltro.
app.cors.origenes-permitidos=http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173

# Hace que los errores de validacion (@Valid) se devuelvan como un cuerpo JSON
# normal en vez de disparar la pagina de error del contenedor, que se generaria
# fuera del filtro de cifrado y por lo tanto viajaria sin cifrar.
spring.mvc.problemdetails.enabled=true

# --- Cookie de sesion (donde viaja el JWT) ---
# secure=true hace que la cookie SOLO viaje por HTTPS. En desarrollo
# (http://localhost) va en false; en produccion DEBE ir en true.
app.cookie.secure=false
# SameSite=Strict: el navegador no manda la cookie si la peticion la origino
# otro sitio. Es la defensa contra CSRF. Solo cambia a None (con secure=true)
# si el frontend queda en un dominio DISTINTO al de la API.
app.cookie.same-site=Strict