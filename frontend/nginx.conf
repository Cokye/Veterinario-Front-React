# ===========================================================================
#  nginx.conf -- configuracion para servir la SPA de React
# ===========================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # --- Lo mas importante de este archivo ---
    #
    # En una SPA existe UNA sola pagina real: index.html. Las "rutas" las maneja
    # React en el navegador, no el servidor. Si alguien entra directo a
    # /dashboard o recarga con F5 estando ahi, nginx buscaria un archivo
    # /dashboard que no existe y devolveria 404.
    #
    # try_files dice: "busca el archivo; si no esta, busca el directorio; y si
    # tampoco, entrega index.html". Asi React arranca y resuelve la ruta el.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite pone un hash en el nombre de cada archivo compilado
    # (index-C9zsUUNV.css). Si el contenido cambia, el nombre cambia, asi que
    # se pueden cachear para siempre sin miedo a servir una version vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html NO se cachea: es el que apunta a los assets con hash, y tiene
    # que reflejar el despliegue nuevo de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
